name: Validate and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate pilot
        run: node tests/validate.mjs
      - name: Syntax check
        run: node --check app.js
      - name: iPad compatibility regression
        run: node tests/ipad-compat.mjs
      - name: Kiosk home regression
        run: node tests/kiosk-home.mjs
      - name: Runtime learning and backup regression
        run: node tests/runtime-flow.mjs
      - name: A design and layout regression
        run: node tests/a-design.mjs
      - name: DAY schedule and progressive learning regression
        run: node tests/learning-review.mjs
      - name: Real Chromium iPad viewport interaction regression
        run: node tests/browser-ipad-run.mjs
      - name: Archive browser viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-chromium-viewport-qa
          path: tests/screenshots/*.png
          if-no-files-found: ignore

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled yet. One-time setup: Settings > Pages > Source = GitHub Actions."
      - name: Build static site
        if: steps.pages.outcome == 'success'
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js manifest.webmanifest VERSION _site/
          cp data/day50.js data/day49.js data/learning-day50.js data/learning-day49.js _site/data/
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
