name: Validate and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/validate.mjs
      - run: node --check app.js
      - run: |
          mkdir -p _site/data
          cp index.html styles.css app.js manifest.webmanifest VERSION _site/
          cp data/day50.js _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
