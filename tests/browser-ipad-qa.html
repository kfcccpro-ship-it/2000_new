<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iPad viewport browser QA (test only)</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}iframe{width:100vw;height:100vh;display:block;border:0}#report{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;padding:2px;font:10px sans-serif;opacity:.07;pointer-events:none}</style>
</head>
<body data-e2e-status="pending">
<div id="report">Starting browser QA...</div>
<iframe id="appFrame" title="Actual student webapp under test"></iframe>
<script>
(async()=>{
"use strict";
const KEY="wm2000pilot_v1",frame=document.getElementById("appFrame"),logs=[];
let seq=0,doc,win;
const assert=(ok,msg)=>{if(!ok)throw Error(msg);logs.push(msg)};
const stamp=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const state=()=>JSON.parse(localStorage.getItem(KEY)||"null");
const seedDay=day=>({nextDay:day,sessionNo:1,history:[],stats:{},current:null,study:null,reviewPlan:{}});
async function mount(seed){
 if(seed!==undefined)localStorage.setItem(KEY,JSON.stringify(seed));
 await new Promise((resolve,reject)=>{
   frame.onload=resolve;frame.onerror=()=>reject(Error("iframe load failed"));
   frame.src="../index.html?qa="+(++seq);
 });
 doc=frame.contentDocument;win=frame.contentWindow;
 assert(!!doc?.getElementById("app"),"actual app loaded");
 win.confirm=()=>true;
 win.alert=message=>{throw Error("Unexpected app alert: "+message)};
 return doc;
}
function active(){
 const a=doc.querySelector(".card.activeQuestion");
 assert(!!a,"active question visible");
 return a;
}
function writeAnswer(inputText){
 const card=active(),input=card.querySelector("[data-in]");
 assert(!!input,"actual input exists");
 input.value=inputText;input.dispatchEvent(new win.Event("input",{bubbles:true}));
 card.querySelector("[data-sub]").click();
}
function selectEvaluation(){
 const home=doc.getElementById("navHome");
 assert(!!home,"inner mode shows back-to-hero navigation");
 home.click();
 assert(!!doc.getElementById("startLearning")&&!!doc.getElementById("startEvaluation"),"both hero choices visible");
 doc.getElementById("startEvaluation").click();
}
const timeoutFail=setTimeout(()=>{
 if(document.body.dataset.e2eStatus==="pending"){
   document.body.dataset.e2eStatus="failed";
   document.getElementById("report").textContent="Timed out in browser QA";
 }
},43000);
try{
 // DAY49 is a real registered source, not a fabricated testing day.
 await mount(seedDay(49));
 assert(doc.querySelector(".kioskDay")?.textContent.includes("DAY 49"),"registered DAY49 is selectable");
 assert(!!doc.getElementById("startLearning")&&!doc.getElementById("startLearning").disabled,"learning choice ready");
 assert(!!doc.getElementById("startEvaluation")&&!doc.getElementById("startEvaluation").disabled,"assessment choice ready");
 doc.getElementById("startLearning").click();
 assert(doc.querySelector(".learningWord")?.textContent==="endow","DAY49 first learning cue from real data");
 await mount();
 assert(!!doc.getElementById("startLearning")&&!!doc.getElementById("startEvaluation"),"reopening the app returns to two-button hero");
 assert(state().study?.index===0&&!state().current,"saved study survives boot without auto-launching assessment");
 doc.getElementById("startLearning").click();
 assert(doc.querySelector(".learningWord")?.textContent==="endow","learning resumes at the original card");
 assert(doc.getElementById("learnMeaning").hidden,"meaning initially concealed");
 await sleep(4750);
 assert(!doc.getElementById("learnMeaning").hidden,"meaning progressively appears");
 assert(!doc.getElementById("sentenceLast").hidden,"Korean example progressively appears");
 assert(!doc.getElementById("nextStudy").disabled,"next learning action unlocks");

 assert(state().current===null,"learning alone must not initialize grading");
 selectEvaluation();
 assert(state().current?.wordKeys.length===40,"DAY49 precisely 40 graded words");
 assert(active().querySelector(".english")?.textContent==="endow","first timed question");
 assert(doc.getElementById("wordTimer")?.textContent==="15","15 second clock begins");

 const first=win.WORD_DATA.days.find(d=>d.day===49).words;
 assert(first.length===40&&first[39].english==="utensil","ordered DAY49 source is loaded");
 for(let i=0;i<40;i++){
   assert(active().dataset.k==="49:"+(i+1),"correct word ID active for index "+i);
   if(i===1){
     const input=active().querySelector("[data-in]");
     input.value="외적인";
     input.dispatchEvent(new win.Event("input",{bubbles:true}));
     assert(state().current.drafts?.["49:2"]==="외적인","unsubmitted Pencil text stored");
     await mount();
     assert(!!doc.getElementById("startLearning")&&!!doc.getElementById("startEvaluation"),"assessment reload displays dual-mode hero");
     assert(state().current.drafts?.["49:2"]==="외적인","unsent input preserved while hero shown");
     doc.getElementById("startEvaluation").click();
     assert(active().dataset.k==="49:2","resume next unanswered word after selecting assessment");
     assert(active().querySelector("[data-in]").value==="외적인","draft survives reload");
   }
   writeAnswer(first[i].answer);
   assert(state().current.answers["49:"+(i+1)]?.result==="correct","strict original-first-meaning grading "+(i+1));
   if((i+1)%8===0){
     const next=doc.getElementById("next");
     assert(next&&!next.disabled,"STEP ready after eight answers "+(i+1));
     next.click();
   }
 }
 assert(state().current?.done===true,"40 answers finish the DAY");
 assert(state().nextDay===48,"DAY49 leads to DAY48 (not yet activated)");
 assert(doc.querySelector(".complete h1"),"completion screen rendered");

 // Previous DAY wrong words must lead the next graded batch with origin badge.
 const y=new Date();y.setDate(y.getDate()-1);
 const reviewSeed=seedDay(50);
 reviewSeed.sessionNo=2;
 reviewSeed.history=[{id:1,date:stamp(y),type:"new",bookDay:49,total:40,
   wordKeys:Array.from({length:40},(_,i)=>"49:"+(i+1)),everWrong:["49:1"],wrongCount:1,retryRounds:1}];
 reviewSeed.stats={"49:1":{wrong:1,correct:0,lastWrong:"오답",attempts:[]}};
 await mount(reviewSeed);
 assert(doc.querySelector(".dueNotice"),"prior error notice visible");
 doc.getElementById("startLearning").click();
 assert(doc.querySelector(".learningWord")?.textContent==="endow","due word appears first in study");
 selectEvaluation();
 assert(state().current.wordKeys.length===41,"yesterday error plus new 40");
 assert(state().current.wordKeys[0]==="49:1","yesterday error first");
 assert(active().querySelector(".originBadge")?.textContent.includes("DAY 49"),"origin DAY label visible");
 assert(doc.getElementById("wordTimer")?.textContent==="15","new timed word starts at 15");
 const beforeClock=state().current.clock?.deadline;
 await sleep(4800);
 const beforeReload=Number(doc.getElementById("wordTimer")?.textContent);
 assert(beforeReload>=9&&beforeReload<=11,"visible countdown decreases");
 await mount();
 assert(!!doc.getElementById("startLearning")&&!!doc.getElementById("startEvaluation"),"clock reload displays dual-mode hero");
 assert(state().current.clock?.deadline===beforeClock,"timed word deadline persists after reload");
 doc.getElementById("startEvaluation").click();
 const afterReload=Number(doc.getElementById("wordTimer")?.textContent);
 assert(afterReload<=beforeReload+1,"reload did not reset 15s");
 await sleep(10800);
 assert(state().current.answers["49:1"]?.status==="relearn","expired word moves to existing relearn gate");
 assert(state().stats["49:1"]?.lastWrong==="시간 초과","deadline failure recorded explicitly");
 assert(!!doc.querySelector(".focusReview"),"focus correction display visible");
 assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+3,"no horizontal viewport overflow");

 // Personal import uses only synthetic data in public CI; local QA can supply
 // the audited, private DAY48 pack without putting its contents in Git/Pages.
 let pack;
 if(new URLSearchParams(location.search).has("privatePack")){
   pack=await (await fetch("./private-pack.json")).json();
 }else{
   pack={format:"wm2000-personal-words",schema:1,days:[{day:48,words:[]}],learning:{day48:[]}};
   for(let i=1;i<=40;i++){
     const english="qa-word-"+i,answer="연습 "+i;
     pack.days[0].words.push({day:48,no:i,english,answer,sourceFirstMeaning:answer,sourceFullMeaning:answer+", 다른 뜻",sourceOrdinal:1880+i});
     pack.learning.day48.push({no:i,english,emoji:"📖",cue:"테스트용 카드",sentence:["독자 작성 예시", " 두 번째 문장"],middle:false});
   }
 }
 const original49=JSON.stringify(win.WORD_DATA.days.find(d=>d.day===49));
 const original50=JSON.stringify(win.WORD_DATA.days.find(d=>d.day===50));
 // Import while DAY49 is unfinished: neither drafts, clock, history nor stats move.
 await mount(seedDay(49));
 doc.getElementById("startEvaluation").click();
 const draft=active().querySelector("[data-in]");draft.value="진행 중 필기";draft.dispatchEvent(new win.Event("input",{bubbles:true}));
 doc.getElementById("navAdmin").click();
 const beforeImport=JSON.stringify(state());
 async function uploadPack(value){
   const file=new win.File([JSON.stringify(value)],"personal.json",{type:"application/json"});
   const transfer=new win.DataTransfer();transfer.items.add(file);
   const input=doc.getElementById("wordFile");input.files=transfer.files;
   const original=input.onchange;
   const completed=new Promise(resolve=>{input.onchange=async event=>{try{await original(event)}finally{resolve()}}});
   input.dispatchEvent(new win.Event("change",{bubbles:true}));await completed;
 }
 await uploadPack(pack);
 assert(doc.getElementById("wordFileMsg").textContent.includes("등록 완료"),"file-input import completed");
 assert(JSON.stringify(state())===beforeImport,"personal import preserves all existing records and drafts");
 assert(JSON.stringify(win.WORD_DATA.days.find(d=>d.day===49))===original49,"DAY49 unchanged after import");
 assert(JSON.stringify(win.WORD_DATA.days.find(d=>d.day===50))===original50,"DAY50 unchanged after import");
 assert(doc.getElementById("dayMessage").textContent.includes("48·49·50"),"registered DAY list is dynamic");
 const storedPack=localStorage.getItem("wm2000personal_words_v1"),tampered=JSON.parse(JSON.stringify(pack));
 tampered.days[0].words[0].answer+="!";
 await uploadPack(tampered);
 assert(doc.getElementById("wordFileMsg").textContent.includes("등록 실패"),"inconsistent first meaning rejected");
 assert(localStorage.getItem("wm2000personal_words_v1")===storedPack&&JSON.stringify(state())===beforeImport,"failed import leaves data and records untouched");
 await mount();
 assert(state().current.drafts["49:1"]==="진행 중 필기","legacy draft survives import and reload");
 doc.getElementById("startEvaluation").click();
 assert(active().dataset.k==="49:1"&&active().querySelector("[data-in]").value==="진행 중 필기","legacy assessment resumes after import");

 await mount(seedDay(48));
 assert(doc.querySelector(".kioskMeta").textContent.includes("40단어"),"DAY48 has 40 words on home");
 doc.getElementById("startLearning").click();
 const words48=win.WORD_DATA.days.find(d=>d.day===48).words;
 assert(doc.querySelector(".learningWord").textContent===words48[0].english,"DAY48 source learning card visible");
 await sleep(4750);
 assert(doc.getElementById("learnMeaning").textContent.includes(words48[0].answer)&&!doc.getElementById("sentenceLast").hidden,"DAY48 first meaning and custom example reveal");
 doc.getElementById("nextStudy").click();await mount();doc.getElementById("startLearning").click();
 assert(state().study.index===1&&doc.querySelector(".learningWord").textContent===words48[1].english,"DAY48 study resumes on second card");
 selectEvaluation();
 for(let i=0;i<40;i++){
   assert(active().dataset.k==="48:"+(i+1),"DAY48 order "+(i+1));
   writeAnswer(words48[i].answer);
   assert(state().current.answers["48:"+(i+1)]?.result==="correct","DAY48 first-meaning exact answer "+(i+1));
   if((i+1)%8===0){assert(!doc.getElementById("next").disabled,"DAY48 STEP unlocked");doc.getElementById("next").click()}
 }
 assert(state().nextDay===47&&state().current.done,"DAY48 completes and advances to 47");

 // DAY50 -> 49 -> imported DAY48 -> fourth-session review, no new DAY47.
 await mount(seedDay(50));
 for(const n of [50,49,48]){
   doc.getElementById("startEvaluation").click();
   const words=win.WORD_DATA.days.find(d=>d.day===n).words;
   assert(state().current.bookDay===n&&state().current.wordKeys.length===40,"descending new DAY "+n);
   for(let i=0;i<40;i++){
     writeAnswer(words[i].answer);
     if((i+1)%8===0)doc.getElementById("next").click();
   }
   doc.getElementById("home").click();
 }
 assert(state().sessionNo===4&&state().nextDay===47,"three new sessions leave next DAY47");
 assert(doc.querySelector(".kioskDay").textContent==="오답 복습","fourth session is review");
 doc.getElementById("startEvaluation").click();
 assert(state().history.at(-1).type==="review"&&state().nextDay===47&&state().sessionNo===5,"fourth review does not advance new DAY");
 assert(doc.querySelector(".score").textContent==="오답 없음","empty review completes cleanly");
 // Real download and file restore through the existing schema-1 controls.
 doc.getElementById("navAdmin").click();
 let captured;
 const realCreate=win.URL.createObjectURL;win.URL.createObjectURL=blob=>{captured=blob;return realCreate.call(win.URL,blob)};
 doc.getElementById("exportBackup").click();
 const saved=JSON.parse(await captured.text());
 assert(saved.schema===1&&saved.state.history.length===4,"schema1 backup includes DAY48 and all four sessions");
 const transfer=new win.DataTransfer();transfer.items.add(new win.File([JSON.stringify(saved)],"records.json",{type:"application/json"}));
 const input=doc.getElementById("restoreBackup");input.files=transfer.files;
 const restoreHandler=input.onchange;
 const restoreCompleted=new Promise(resolve=>{input.onchange=async event=>{try{await restoreHandler(event)}finally{resolve()}}});
 input.dispatchEvent(new win.Event("change",{bubbles:true}));await restoreCompleted;
 assert(doc.getElementById("backupMsg").textContent.includes("복원 완료")&&JSON.stringify(state())===JSON.stringify(saved.state),"DAY48 record backup restores without drift");
 win.URL.createObjectURL=realCreate;
 assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+3,"personal import admin has no horizontal overflow");

 // Fourth session must also review wrong imported words when DAY47 is absent.
 const wrongReview=seedDay(47);wrongReview.sessionNo=4;
 wrongReview.history=[50,49,48].map((n,i)=>({id:i+1,date:stamp(new Date()),type:"new",bookDay:n,total:40,wordKeys:Array.from({length:40},(_,j)=>n+":"+(j+1)),everWrong:n===48?["48:1"]:[],wrongCount:n===48?1:0,retryRounds:1}));
 await mount(wrongReview);doc.getElementById("startEvaluation").click();
 assert(state().current.type==="review"&&state().current.wordKeys.join(",")==="48:1","fourth review contains imported wrong word only, no new DAY47");
 writeAnswer(words48[0].answer+"!");
 assert(state().current.answers["48:1"].result==="wrong","DAY48 strict grading rejects changed meaning");
 const canvas=doc.querySelector("[data-trace]"),box=canvas.getBoundingClientRect();
 // Synthetic pen events exercise the real canvas handler; capture is stubbed
 // because a programmatically dispatched pointer has no OS capture target.
 const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
 for(const [type,x] of [["pointerdown",15],["pointermove",65],["pointerup",65]])canvas.dispatchEvent(new win.PointerEvent(type,{bubbles:true,pointerType:"pen",pointerId:1,isPrimary:true,pressure:.5,clientX:box.left+x,clientY:box.top+25}));
 canvas.setPointerCapture=capture;
 doc.querySelector("[data-tdone]").click();
 const retry=doc.querySelector("[data-re]");retry.value=words48[0].answer;retry.dispatchEvent(new win.Event("input",{bubbles:true}));
 doc.querySelector("[data-rsub]").click();
 assert(state().current.answers["48:1"].relearnDone,"imported wrong word completes Pencil-style trace and re-entry");
 doc.getElementById("next").click();
 assert(state().current.phase==="retry"&&active().dataset.k==="48:1","DAY48 wrong word enters mandatory same-session retest");
 writeAnswer(words48[0].answer);doc.getElementById("next").click();
 assert(state().nextDay===47&&state().current.done&&state().history.at(-1).everWrong.includes("48:1"),"review records imported error and preserves next new DAY");

 document.body.dataset.e2eStatus="passed";
 document.getElementById("report").textContent="PASS "+logs.length+" checks";
 clearTimeout(timeoutFail);
}catch(e){
 document.body.dataset.e2eStatus="failed";
 document.getElementById("report").textContent="FAIL "+e.message+" | completed "+logs.length+" checks";
 console.error(e);
 clearTimeout(timeoutFail);
}
})();
</script>
</body></html>
